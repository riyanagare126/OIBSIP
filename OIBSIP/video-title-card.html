<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OIBSIP — 2-Second Demo Video Title Card (Riya Shivaji Nagare)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top left, #1e3a8a, #0f172a 70%);
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .toolbar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.75);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .toolbar button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .card {
      max-width: 860px;
      width: 100%;
      padding: 56px 48px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    }
    .org {
      font-size: 0.95rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #93c5fd;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-top: 20px;
    }
    .name {
      font-size: 2.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-top: 4px;
      outline: none;
      border-bottom: 2px dashed rgba(255,255,255,0.2);
      display: inline-block;
      padding: 0 12px;
    }
    .track {
      font-size: 1.55rem;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 6px;
    }
    .task {
      font-size: 2rem;
      font-weight: 800;
      color: #facc15;
      margin-top: 6px;
    }
    .hint {
      position: fixed;
      bottom: 14px;
      font-size: 0.78rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="setTask('Task 1 · Online Reservation System')">Task 1</button>
    <button onclick="setTask('Task 2 · Number Guessing Game')">Task 2</button>
    <button onclick="setTask('Task 3 · ATM Interface')">Task 3</button>
    <button onclick="setTask('Task 4 · Online Examination System')">Task 4</button>
    <button onclick="setTask('Task 5 · Digital Library Management System')">Task 5</button>
  </div>

  <div class="card">
    <div class="org">OASIS INFOBYTE — SIP INTERNSHIP DEMO</div>

    <div class="label">1 · Intern Full Name</div>
    <div class="name" contenteditable="true" spellcheck="false">Riya Shivaji Nagare</div>

    <div class="label">2 · Assigned Track</div>
    <div class="track">Java Development</div>

    <div class="label">3 · Task Title</div>
    <div class="task" id="taskTitle">Task 1 · Online Reservation System</div>
  </div>

  <div class="hint">Tip: Press F11 for full screen and record 2 seconds before switching to your app window.</div>

  <script>
    function setTask(title) {
      document.getElementById('taskTitle').textContent = title;
    }
  </script>
</body>
</html>
