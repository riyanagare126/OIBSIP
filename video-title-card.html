<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OIBSIP — 2-Second Demo Video Title Card (Riya Shivaji Nagare)</title>
  <style>
    :root {
      --bg-start: #7f1d1d;
      --bg-end: #1c1917;
      --card-border: #f59e0b;
      --accent-track: #fbbf24;
      --accent-task: #fda4af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top left, var(--bg-start), var(--bg-end) 72%);
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      transition: background 0.35s ease;
    }
    .toolbar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.65);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .toolbar button {
      color: #fff;
      border: none;
      padding: 7px 13px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-t1 { background: #b91c1c; }
    .btn-t2 { background: #7c3aed; }
    .btn-t3 { background: #059669; }
    .btn-t4 { background: #0d9488; }
    .btn-t5 { background: #c2410c; }
    .card {
      max-width: 880px;
      width: 100%;
      padding: 56px 48px;
      border-radius: 22px;
      background: rgba(15, 23, 42, 0.55);
      border: 2px solid var(--card-border);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    }
    .org {
      font-size: 0.95rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-track);
      font-weight: 700;
      margin-bottom: 24px;
    }
    .label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #cbd5e1;
      margin-top: 20px;
    }
    .name {
      font-size: 2.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-top: 4px;
      outline: none;
      border-bottom: 2px dashed rgba(255,255,255,0.25);
      display: inline-block;
      padding: 0 12px;
    }
    .track {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--accent-track);
      margin-top: 6px;
    }
    .task {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-task);
      margin-top: 6px;
    }
    .hint {
      position: fixed;
      bottom: 14px;
      font-size: 0.78rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn-t1" onclick="setTheme(1, 'Task 1 · Online Reservation System', '#7f1d1d', '#1c1917', '#f59e0b', '#fbbf24', '#fecdd3')">Task 1 (Ruby)</button>
    <button class="btn-t2" onclick="setTheme(2, 'Task 2 · Number Guessing Game', '#4c1d95', '#0f172a', '#a855f7', '#e879f9', '#f0abfc')">Task 2 (Violet)</button>
    <button class="btn-t3" onclick="setTheme(3, 'Task 3 · ATM Interface', '#064e3b', '#022c22', '#10b981', '#34d399', '#fde047')">Task 3 (Emerald)</button>
    <button class="btn-t4" onclick="setTheme(4, 'Task 4 · Online Examination System', '#134e4a', '#0f172a', '#14b8a6', '#2dd4bf', '#fdba74')">Task 4 (Teal)</button>
    <button class="btn-t5" onclick="setTheme(5, 'Task 5 · Digital Library Management System', '#7c2d12', '#1c1917', '#f97316', '#fdba74', '#fde047')">Task 5 (Terracotta)</button>
  </div>

  <div class="card">
    <div class="org">OASIS INFOBYTE — SIP INTERNSHIP DEMO</div>

    <div class="label">1 · Intern Full Name</div>
    <div class="name" contenteditable="true" spellcheck="false">Riya Shivaji Nagare</div>

    <div class="label">2 · Assigned Track</div>
    <div class="track">Java Development</div>

    <div class="label">3 · Task Title</div>
    <div class="task" id="taskTitle">Task 1 · Online Reservation System</div>
  </div>

  <div class="hint">Each task button above applies a unique signature color palette!</div>

  <script>
    function setTheme(num, title, start, end, border, trackCol, taskCol) {
      document.getElementById('taskTitle').textContent = title;
      const root = document.documentElement.style;
      root.setProperty('--bg-start', start);
      root.setProperty('--bg-end', end);
      root.setProperty('--card-border', border);
      root.setProperty('--accent-track', trackCol);
      root.setProperty('--accent-task', taskCol);
    }
  </script>
</body>
</html>
